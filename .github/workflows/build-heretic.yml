name: Build Heretic Ollama Image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/redfox485/heretic-ollama:latest
          platforms: linux/amd64

      - name: Make package public
        run: |
          # Wait a moment for package to be created
          sleep 10
          # Get package ID and make public
          PACKAGE_ID=$(gh api repos/RedFox485/heretic-ollama/packages --jq '.[0].id')
          if [ -n "$PACKAGE_ID" ]; then
            gh api -X PUT repos/RedFox485/heretic-ollama/packages/$PACKAGE_ID/visibility -F visibility=public
            echo "Package made public"
          else
            echo "Package not found yet"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
