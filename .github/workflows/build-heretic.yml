name: Build Heretic Ollama Image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/redfox485/heretic-ollama:latest
          platforms: linux/amd64

      - name: Make GHCR package public
        run: |
          # Wait for package to be created
          sleep 30
          PACKAGE_ID=$(gh api repos/RedFox485/heretic-ollama/packages --jq '.[] | select(.name == "heretic-ollama") | .id')
          if [ -n "$PACKAGE_ID" ]; then
            gh api -X PUT repos/RedFox485/heretic-ollama/packages/$PACKAGE_ID/visibility -F visibility=public
            echo "Package made public"
          else
            echo "Package not found yet, trying again in 30s"
            sleep 30
            PACKAGE_ID=$(gh api repos/RedFox485/heretic-ollama/packages --jq '.[] | select(.name == "heretic-ollama") | .id')
            if [ -n "$PACKAGE_ID" ]; then
              gh api -X PUT repos/RedFox485/heretic-ollama/packages/$PACKAGE_ID/visibility -F visibility=public
              echo "Package made public on retry"
            else
              echo "Package still not found"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
